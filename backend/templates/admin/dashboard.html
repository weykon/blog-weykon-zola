{% extends "base.html" %}

{% block title %}Admin Dashboard{% endblock %}

{% block content %}
<div class="admin-dashboard">
    <h1>Admin Dashboard</h1>

    <div class="actions">
        <a href="{{ base_path | default(value="") }}/admin/editor" class="btn btn-primary">New Post</a>
    </div>

    <!-- 草稿箱 -->
    <section class="posts-management">
        <h2>草稿箱 <span id="draft-count" style="font-size:0.8em;color:#888">(0)</span></h2>
        <div id="drafts-list">Loading...</div>
    </section>

    <!-- 已发布文章 -->
    <section class="posts-management">
        <h2>已发布文章</h2>
        <div id="posts-list">Loading...</div>
    </section>
</div>

<style>
.admin-dashboard {
    max-width: 1200px;
    margin: 2rem auto;
    padding: 2rem;
}

.actions {
    margin: 2rem 0;
}

.posts-management {
    margin-top: 2rem;
}

.post-item {
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 1rem;
    margin-bottom: 0.75rem;
    background: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.post-item-info {
    flex: 1;
}

.post-item-info h3 {
    margin: 0 0 0.25rem 0;
    font-size: 1rem;
}

.post-item-info p {
    margin: 0;
    font-size: 0.85rem;
    color: #6b7280;
}

.post-item-actions {
    display: flex;
    gap: 0.5rem;
    align-items: center;
}

.post-item-actions .btn {
    padding: 0.4rem 0.75rem;
    font-size: 0.8rem;
    border-radius: 4px;
    cursor: pointer;
    text-decoration: none;
    border: none;
}

.btn-publish {
    background: #16a34a;
    color: white;
}

.btn-publish:hover {
    background: #15803d;
}

.btn-delete {
    background: #ef4444;
    color: white;
}

.btn-delete:hover {
    background: #dc2626;
}

.draft-badge {
    font-size: 0.7rem;
    background: #fef3c7;
    color: #92400e;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    margin-left: 0.5rem;
}
</style>

<script>
// Base path for subdirectory deployment
const basePath = '{{ base_path | default(value="") | safe }}';

// Load all posts (admin view) and split into drafts / published
fetch(basePath + '/api/admin/posts')
    .then(res => res.json())
    .then(data => {
        if (data.success && data.data) {
            const drafts = data.data.filter(p => p.is_draft);
            const published = data.data.filter(p => !p.is_draft);

            // Render drafts
            document.getElementById('draft-count').textContent = `(${drafts.length})`;
            if (drafts.length === 0) {
                document.getElementById('drafts-list').innerHTML = '<p style="color:#9ca3af">暂无草稿</p>';
            } else {
                document.getElementById('drafts-list').innerHTML = drafts.map(post => `
                    <div class="post-item">
                        <div class="post-item-info">
                            <h3>${post.title} <span class="draft-badge">草稿</span></h3>
                            <p>${post.slug} · 更新于 ${new Date(post.updated_at).toLocaleDateString('zh-CN')}</p>
                        </div>
                        <div class="post-item-actions">
                            <a href="${basePath}/admin/editor/${post.id}" class="btn btn-primary">编辑</a>
                            <button class="btn btn-publish" onclick="publishPost(${post.id})">发布</button>
                            <button class="btn btn-delete" onclick="deletePost(${post.id})">删除</button>
                        </div>
                    </div>
                `).join('');
            }

            // Render published
            if (published.length === 0) {
                document.getElementById('posts-list').innerHTML = '<p style="color:#9ca3af">暂无已发布文章</p>';
            } else {
                document.getElementById('posts-list').innerHTML = published.map(post => `
                    <div class="post-item">
                        <div class="post-item-info">
                            <h3>${post.title}</h3>
                            <p>${post.slug} · 更新于 ${new Date(post.updated_at).toLocaleDateString('zh-CN')}</p>
                        </div>
                        <div class="post-item-actions">
                            <a href="${basePath}/admin/editor/${post.id}" class="btn btn-primary">编辑</a>
                            <a href="${basePath}/posts/${post.slug}" target="_blank" class="btn" style="background:#e5e7eb;color:#374151">查看</a>
                        </div>
                    </div>
                `).join('');
            }
        }
    })
    .catch(err => {
        document.getElementById('drafts-list').innerHTML = '加载失败。';
        document.getElementById('posts-list').innerHTML = '加载失败。';
    });

// Publish a draft
async function publishPost(id) {
    if (!confirm('确定要发布这篇文章吗？')) return;
    const res = await fetch(basePath + '/api/posts/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ is_draft: false }),
    });
    const result = await res.json();
    if (result.success) {
        location.reload();
    } else {
        alert('发布失败: ' + (result.error || '未知错误'));
    }
}

// Delete a post
async function deletePost(id) {
    if (!confirm('确定要删除这篇文章吗？此操作不可恢复！')) return;
    const res = await fetch(basePath + '/api/posts/' + id, { method: 'DELETE' });
    const result = await res.json();
    if (result.success) {
        location.reload();
    } else {
        alert('删除失败: ' + (result.error || '未知错误'));
    }
}
</script>
{% endblock %}
